version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ventasfix_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ventasfix
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ventasfix_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ventasfix_api
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=ventasfix
      - JWT_SECRET=ventasfix_secret_key_2026
      - PORT=3000
    depends_on:
      - db
    networks:
      - ventasfix_network
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ventasfix_frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
    depends_on:
      - api
    networks:
      - ventasfix_network
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules

networks:
  ventasfix_network:
    driver: bridge

volumes:
  db_data:
